<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineghost Bot - Login</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <nav>
        <h1>🛡️ <span>Mineghost</span> Bot</h1>
    </nav>

    <div class="login-screen">
        <div class="login-container">
            <h2>🔐 Login Panel Admin</h2>
            <div id="loginError" class="mensaje error hidden"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="usuario">👤 Usuario:</label>
                    <input type="text" id="usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label for="contraseña">🔑 Contraseña:</label>
                    <input type="password" id="contraseña" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Iniciar Sesión</button>
            </form>

            <div class="info">
                <div style="font-weight: 600; margin-bottom: 0.5rem;">💡 Credenciales por defecto:</div>
                <strong>Usuario:</strong> admin<br>
                <strong>Contraseña:</strong> admin123
            </div>
        </div>
    </div>

    <script src="scripts/database.js"></script>
    <script>
        // Inicializar BD
        initDatabase();

        function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const contraseña = document.getElementById('contraseña').value;

            const usuarioValido = validateUser(usuario, contraseña);

            if (usuarioValido) {
                // Guardar sesión
                localStorage.setItem('currentUser', usuario);
                localStorage.setItem('loggedIn', 'true');
                
                // Redirigir al panel admin
                window.location.href = 'admin.html';
            } else {
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = '❌ Usuario o contraseña incorrectos';
                errorDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    errorDiv.classList.add('hidden');
                }, 3000);
            }
        }
    </script>
</body>
</html>
